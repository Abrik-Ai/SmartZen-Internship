name: CI

on: pull_request

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy .
      - run: pytest
      - name: Validate golden set
        run: python scripts/validate_golden_set.py
      - name: Install and Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # Wait until the Ollama daemon responds on port 11434
          until curl -s http://localhost:11434/api/tags > /dev/null; do sleep 1; done
          # Pull the exact default model specified in your config
          ollama pull qwen2.5:3b
      - name: Run evaluation harness
        env:
          JWT_ACCESS_SECRET: "ci_dummy_jwt_secret_12345"
          EVAL_ACCOUNT_EMAIL: ${{ secrets.EVAL_ACCOUNT_EMAIL }}
          EVAL_ACCOUNT_PASSWORD: ${{ secrets.EVAL_ACCOUNT_PASSWORD }}
        run: python scripts/run_eval.py
      - name: Run injection attack suite
        env:
          JWT_ACCESS_SECRET: "ci_dummy_jwt_secret_12345"
          EVAL_ACCOUNT_EMAIL: ${{ secrets.EVAL_ACCOUNT_EMAIL }}
          EVAL_ACCOUNT_PASSWORD: ${{ secrets.EVAL_ACCOUNT_PASSWORD }}
        run: python -m scripts.prompt_injections
      - name: Post scorecard comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('eval_report.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '```\n' + report + '\n```'
            });