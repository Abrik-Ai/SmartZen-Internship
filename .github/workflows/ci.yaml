name: CI

on: pull_request

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
      - uses: actions/checkout@v4
      - name: Set up Python
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy.
      - run: pytest