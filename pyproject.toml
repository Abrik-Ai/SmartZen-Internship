[project]
name = "smartzen-ai"
version = "0.1.0"
authors = [{ name = "halfbldprinc" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "langgraph>=0.2.20",
  # LOCAL model provider. SmartZen runs a local Ollama model so no data leaves
  "langchain-ollama>=0.2.0",
  "pgvector>=0.3.5",
  "psycopg[binary]>=3.2.1",
  "pydantic>=2.9.0",
  # HTTP client - used by app/backend_client.py to call backend
  "httpx>=0.27.2",
  "python-dotenv>=1.0.1",
  # Verifies the caller's login token using the same secret the backend signs
  # with (task 1.2). The AI service never has its own account.
  "pyjwt>=2.9.0",
  # Required for pydantic's EmailStr
  "email-validator>=2.3.0",
  # Reads the RAG eval test_questions.yaml file
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  # Generates Pydantic models from OpenAPI contract
  "datamodel-code-generator>=0.71.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "numpy>=2.5.1",
  # Enables pytest to run async test
  "pytest-asyncio>=1.4.0",
  "types-PyYAML>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
